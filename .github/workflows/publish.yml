name: Publish alpha

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump prerelease version and tag
        run: |
          LATEST_TAG=$(git tag --merged HEAD -l "v*-alpha*" | sort -V | tail -1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT=${LATEST_TAG#v}
          else
            CURRENT=$(node -p "require('./package.json').version")
          fi
          NEXT=$(npx --yes semver -i prerelease --preid alpha "$CURRENT")
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.version='$NEXT';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git tag "v$NEXT"

      - name: Push tag
        run: git push --tags

      - name: Publish to npm
        run: npm publish --provenance
