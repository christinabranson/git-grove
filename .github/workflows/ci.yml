name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Check entrypoint consistency
        run: npm run check:entrypoints

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run coverage

      - name: Run example e2e tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  fallow:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run fallow audit
        id: audit
        continue-on-error: true
        run: |
          npx fallow audit \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --format pr-comment-github \
            --output-file fallow-comment.md

      - name: Post fallow PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx fallow ci post-pr-comment \
            --provider github \
            --body fallow-comment.md \
            --marker-id fallow-audit \
            --pr "${{ github.event.pull_request.number }}"

      - name: Fail on new issues introduced by this PR
        if: steps.audit.outcome == 'failure'
        run: |
          echo "fallow audit found issues introduced by this PR. See the PR comment for details."
          exit 1
