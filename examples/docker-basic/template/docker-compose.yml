services:
  web:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - DB_SCHEMA=${DB_SCHEMA}
    command: >
      node -e "require('http').createServer((_,r)=>r.end('docker-basic\n')).listen(3000,()=>console.log('listening on 3000'))"
